<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VidGlean</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="stylesheet" href="/vendor/katex/katex.min.css" />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div id="splash">
      <div class="splash-inner">
        <img class="splash-logo" src="/icon-192.png" alt="" />
        <div class="splash-name">VidGlean</div>
        <div class="splash-status" id="splash-status">正在初始化…</div>
      </div>
    </div>

    <div id="app" hidden>
      <aside class="sidebar">
        <div class="brand">
          <img class="brand-mark" src="/favicon.png" alt="" />
          <span class="brand-name">VidGlean</span>
          <button class="panel-btn collapse-btn" id="btn-collapse" title="收起侧边栏" aria-label="收起侧边栏">
            <svg viewBox="0 0 16 16" width="17" height="17" aria-hidden="true">
              <rect x="1.4" y="2.4" width="13.2" height="11.2" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.3" />
              <line x1="6.1" y1="3.2" x2="6.1" y2="12.8" stroke="currentColor" stroke-width="1.3" />
            </svg>
          </button>
        </div>
        <nav class="nav">
          <a href="#/home" data-nav="home" title="全部文档">
            <span class="nav-icon">▤</span>
            <span class="nav-label">全部文档</span>
          </a>
          <a href="#/starred" data-nav="starred" title="星标文档">
            <span class="nav-icon">★</span>
            <span class="nav-label">星标文档</span>
          </a>
          <a href="#/tasks" data-nav="tasks" title="任务">
            <span class="nav-icon">☷</span>
            <span class="nav-label">任务</span>
          </a>
          <a href="#/settings" data-nav="settings" title="设置">
            <span class="nav-icon">⚙</span>
            <span class="nav-label">设置</span>
          </a>
        </nav>
        <div class="side-section">
          <div class="side-title">我的分类</div>
          <ul class="cat-list" id="cat-list"></ul>
          <button class="link-btn" id="new-cat">+ 新建分类</button>
        </div>
        <div class="side-foot" id="side-foot"></div>
      </aside>

      <main class="main">
        <header class="topbar">
          <button class="panel-btn expand-btn" id="btn-expand" title="展开侧边栏" aria-label="展开侧边栏">
            <svg viewBox="0 0 16 16" width="17" height="17" aria-hidden="true">
              <rect x="1.4" y="2.4" width="13.2" height="11.2" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.3" />
              <line x1="6.1" y1="3.2" x2="6.1" y2="12.8" stroke="currentColor" stroke-width="1.3" />
            </svg>
          </button>
          <input class="search" id="search" type="search" placeholder="搜索文档（Ctrl+F）" />
          <button class="btn primary import-btn" id="btn-import" title="导入链接（Ctrl+N）">导入链接</button>
        </header>
        <section class="view" id="view"></section>
      </main>
    </div>

    <div class="toast-wrap" id="toast"></div>
    <div id="modal-root"></div>
    <div class="chat-drawer" id="chat-drawer" hidden></div>

    <script defer src="/vendor/katex/katex.min.js"></script>
    <script defer src="/vendor/katex/auto-render.min.js"></script>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
