<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VidGlean</title>
    <link rel="stylesheet" href="/vendor/katex/katex.min.css" />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div id="splash">
      <div class="splash-inner">
        <div class="splash-logo">V</div>
        <div class="splash-name">VidGlean</div>
        <div class="splash-status" id="splash-status">正在初始化…</div>
      </div>
    </div>

    <div id="app" hidden>
      <aside class="sidebar">
        <div class="brand"><span class="brand-mark">V</span> VidGlean</div>
        <nav class="nav">
          <a href="#/home" data-nav="home">全部文档</a>
          <a href="#/starred" data-nav="starred">星标文档</a>
          <a href="#/tasks" data-nav="tasks">任务</a>
          <a href="#/settings" data-nav="settings">设置</a>
        </nav>
        <div class="side-section">
          <div class="side-title">我的分类</div>
          <ul class="cat-list" id="cat-list"></ul>
          <button class="link-btn" id="new-cat">+ 新建分类</button>
        </div>
        <div class="side-foot" id="side-foot"></div>
      </aside>

      <main class="main">
        <header class="topbar">
          <input class="search" id="search" type="search" placeholder="搜索文档（Ctrl+F）" />
          <button class="btn ghost" id="btn-import" title="Ctrl+N">+ 导入视频</button>
        </header>
        <section class="view" id="view"></section>
      </main>
    </div>

    <div class="toast-wrap" id="toast"></div>
    <div id="modal-root"></div>
    <div class="chat-drawer" id="chat-drawer" hidden></div>

    <script defer src="/vendor/katex/katex.min.js"></script>
    <script defer src="/vendor/katex/auto-render.min.js"></script>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
