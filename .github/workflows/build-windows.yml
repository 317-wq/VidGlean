name: Build Windows Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra desktop --extra build

      - name: Build with PyInstaller
        run: uv run pyinstaller packaging/vidglean.spec --noconfirm

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found" }
          & $iscc "packaging\vidglean.iss"

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: VidGlean-windows
          path: |
            dist/VidGlean/**
            dist/VidGlean-*-setup.exe
          if-no-files-found: error

      - name: Attach installer to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/VidGlean-*-setup.exe
          body: |
            Windows 10 / 11 安装包。

            **安装说明**

            - 未做代码签名，首次运行时 Windows 可能拦截：点「更多信息」→「仍要运行」
            - 需要 WebView2 Runtime：Windows 11 自带；Windows 10 缺失时窗口会白屏，装一次 Evergreen Runtime 即可
            - 数据默认保存在 `%LOCALAPPDATA%\VidGlean`，卸载时会询问是否一并删除
            - 启动失败请查看 `%LOCALAPPDATA%\VidGlean\logs\startup-error.log`

            **首次使用**

            打开「设置」→ 添加 OpenAI 兼容模型（Base URL / 模型名 / API Key）；再到「B 站」页填入 SESSDATA。

